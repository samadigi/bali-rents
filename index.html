  <script>
    /**
     * KONFIGURASI BACKEND GOOGLE APPS SCRIPT UNTUK GITHUB PAGES
     */
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbywQs-e3wuWMsTiWffnbpEqdsXUCF8aUOtNAEtDTjobz3wEUDisQyb8F5bCKEdLogZ9jQ/exec';
    const isGasRuntime = typeof google !== 'undefined' && google.script && google.script.run;

    /**
     * Universal API Client untuk GitHub Pages & Apps Script
     * Menggunakan fetch text/plain untuk melewati batasan CORS preflight OPTIONS pada GAS
     */
    async function callGasBackend(action, payload = {}) {
      // 1. Jika dijalankan di dalam container-bound Apps Script
      if (isGasRuntime) {
        return new Promise((resolve, reject) => {
          const runner = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(err => resolve({ success: false, message: err.message || err }));

          if (typeof runner[action] === 'function') {
            const args = Object.values(payload);
            runner[action](...args);
          } else {
            resolve({ success: false, message: `Fungsi ${action} tidak tersedia di GAS runtime.` });
          }
        });
      }

      // 2. Jika di-host di GitHub Pages / Standalone Web Host
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8' // Mencegah browser mengirim CORS OPTIONS preflight
          },
          body: JSON.stringify({
            action: action,
            ...payload
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }

        const data = await response.json();
        return data;
      } catch (error) {
        console.warn(`[DewataRide API Error on "${action}"]:`, error);
        return { success: false, message: error.message, isOfflineFallback: true };
      }
    }

    async function refreshArmadaData() {
      const res = await callGasBackend('getPublicAppPayload');
      if (res && res.success) {
        if (Array.isArray(res.armada) && res.armada.length > 0) {
          state.armada = res.armada;
        }
        if (res.settings) {
          state.settings = { ...state.settings, ...res.settings };
          if (res.settings.HERO_BANNERS) {
            try {
              const parsedBanners = JSON.parse(res.settings.HERO_BANNERS);
              if (Array.isArray(parsedBanners) && parsedBanners.length > 0) {
                state.banners = parsedBanners;
                setup3DCarouselDOM();
                update3DCarousel();
              }
            } catch (e) {
              console.error('Failed to parse backend banners', e);
            }
          }
